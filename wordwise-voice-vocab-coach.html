<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordWise — Voice Vocabulary Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF0EC;
    --bg-card: #FFFFFF;
    --ink: #17262A;
    --ink-soft: #4C5D5C;
    --accent: #B5772A;
    --accent-soft: #F1E2CC;
    --teal: #2E6F63;
    --teal-soft: #DCEBE6;
    --line: #D3DED8;
    --err: #B5432E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181A;
      --bg-card: #1C2528;
      --ink: #ECF2EF;
      --ink-soft: #A9B8B5;
      --accent: #D99A4E;
      --accent-soft: #3A2F1E;
      --teal: #6FBBA9;
      --teal-soft: #1E3733;
      --line: #2E3A3B;
      --err: #E08167;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181A;
    --bg-card: #1C2528;
    --ink: #ECF2EF;
    --ink-soft: #A9B8B5;
    --accent: #D99A4E;
    --accent-soft: #3A2F1E;
    --teal: #6FBBA9;
    --teal-soft: #1E3733;
    --line: #2E3A3B;
    --err: #E08167;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  .app {
    width: 100%;
    max-width: 460px;
  }
  header {
    text-align: left;
    margin-bottom: 18px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  .tagline {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 3px 0 0;
  }
  .progress-row {
    display: flex;
    gap: 6px;
    margin: 18px 0 16px;
  }
  .dot {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--line);
    transition: background 0.3s ease;
  }
  .dot.done { background: var(--teal); }
  .dot.current { background: var(--accent); }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 26px 26px;
  }
  .card-eyebrow {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .word {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.05;
    margin: 0 0 6px;
    word-break: break-word;
  }
  .pos {
    font-size: 13.5px;
    color: var(--teal);
    font-weight: 600;
    margin: 0 0 18px;
  }
  .stage {
    min-height: 78px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }
  .stage b { color: var(--ink); font-weight: 600; }
  .stage .agent-line {
    color: var(--ink);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  button {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn-primary {
    flex: 1;
    background: var(--teal);
    color: #fff;
  }
  .btn-mic {
    flex: 1;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .btn-mic.listening {
    background: var(--accent);
    color: #fff;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(181,119,42,0.35); }
    50% { box-shadow: 0 0 0 8px rgba(181,119,42,0); }
  }
  .btn-next {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    display: none;
  }
  .btn-next.show { display: flex; }

  .heard {
    background: var(--teal-soft);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 13.5px;
    color: var(--ink);
    margin-top: 4px;
    display: none;
  }
  .heard.show { display: block; }
  .verdict {
    font-size: 13.5px;
    font-weight: 600;
    margin-top: 10px;
    display: none;
  }
  .verdict.show { display: block; }
  .verdict.good { color: var(--teal); }
  .verdict.retry { color: var(--err); }

  .type-fallback {
    display: none;
    margin-top: 10px;
    gap: 8px;
  }
  .type-fallback.show { display: flex; }
  .type-fallback input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .type-fallback button {
    background: var(--teal);
    color: #fff;
    padding: 11px 16px;
  }

  .footer-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 16px;
  }

  .done-screen {
    text-align: center;
    padding: 20px 6px 6px;
  }
  .done-screen .word {
    font-size: 30px;
  }
  .score {
    font-family: 'Fraunces', serif;
    font-size: 46px;
    font-weight: 600;
    color: var(--teal);
    margin: 6px 0 2px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="brand">WordWise</p>
    <p class="tagline">A voice coach that helps you practise new words out loud.</p>
  </header>

  <div class="progress-row" id="progressRow"></div>

  <div class="card" id="mainCard">
    <p class="card-eyebrow" id="eyebrow">Word 1 of 8</p>
    <p class="word" id="wordDisplay">meticulous</p>
    <p class="pos" id="posDisplay">adjective</p>
    <div class="stage" id="stage">Tap "Hear it" to have WordWise say the word, its meaning, and an example.</div>

    <div class="controls">
      <button class="btn-primary" id="hearBtn">🔊 Hear it</button>
      <button class="btn-mic" id="micBtn">🎤 Your turn</button>
    </div>
    <div class="type-fallback" id="typeFallback">
      <input type="text" id="typeInput" placeholder="Type a sentence with the word...">
      <button id="typeSubmit">Check</button>
    </div>
    <div class="heard" id="heard"></div>
    <div class="verdict" id="verdict"></div>

    <button class="btn-next" id="nextBtn">Next word →</button>
  </div>

  <p class="footer-note" id="footerNote">Works best in Chrome, with your microphone allowed.</p>
</div>

<script>
const words = [
  { word: "meticulous", pos: "adjective", meaning: "showing great care and attention to detail", example: "She was meticulous while checking every row of the report." },
  { word: "collaborate", pos: "verb", meaning: "to work together with others on a task", example: "The two teams had to collaborate to finish the dashboard on time." },
  { word: "proactive", pos: "adjective", meaning: "acting in advance to deal with a problem before it happens", example: "Being proactive, she flagged the data error before anyone noticed." },
  { word: "resourceful", pos: "adjective", meaning: "good at finding quick and clever ways to solve problems", example: "He was resourceful and found a workaround when the tool crashed." },
  { word: "articulate", pos: "adjective", meaning: "able to express ideas clearly and effectively", example: "She gave an articulate explanation of the sales trend to the client." },
  { word: "adaptable", pos: "adjective", meaning: "able to adjust easily to new conditions", example: "Being adaptable helped him switch tools when the project changed." },
  { word: "diligent", pos: "adjective", meaning: "showing care and steady effort in your work", example: "The diligent intern double-checked every number before submitting." },
  { word: "concise", pos: "adjective", meaning: "giving information clearly in few words", example: "Keep your update concise so the manager can read it quickly." }
];

let idx = 0;
let score = 0;
let recognizing = false;

const eyebrow = document.getElementById('eyebrow');
const wordDisplay = document.getElementById('wordDisplay');
const posDisplay = document.getElementById('posDisplay');
const stage = document.getElementById('stage');
const hearBtn = document.getElementById('hearBtn');
const micBtn = document.getElementById('micBtn');
const nextBtn = document.getElementById('nextBtn');
const heard = document.getElementById('heard');
const verdict = document.getElementById('verdict');
const progressRow = document.getElementById('progressRow');
const typeFallback = document.getElementById('typeFallback');
const typeInput = document.getElementById('typeInput');
const typeSubmit = document.getElementById('typeSubmit');
const footerNote = document.getElementById('footerNote');
const mainCard = document.getElementById('mainCard');

function buildDots() {
  progressRow.innerHTML = '';
  words.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
    progressRow.appendChild(d);
  });
}

function speak(text, onEnd) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.onend = () => { if (onEnd) onEnd(); };
    window.speechSynthesis.speak(u);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function loadWord() {
  const w = words[idx];
  eyebrow.textContent = `Word ${idx + 1} of ${words.length}`;
  wordDisplay.textContent = w.word;
  posDisplay.textContent = w.pos;
  stage.innerHTML = `Tap "Hear it" and WordWise will say <b>${w.word}</b>, what it means, and use it in a sentence.`;
  heard.classList.remove('show');
  verdict.classList.remove('show');
  nextBtn.classList.remove('show');
  micBtn.disabled = false;
  buildDots();
}

hearBtn.addEventListener('click', () => {
  const w = words[idx];
  const line = `${w.word}. It means: ${w.meaning}. For example — ${w.example}. Now, try using "${w.word}" in your own sentence.`;
  stage.innerHTML = `<span class="agent-line">"${line}"</span>`;
  hearBtn.disabled = true;
  speak(line, () => { hearBtn.disabled = false; });
});

function evaluateAnswer(transcript) {
  const w = words[idx];
  heard.textContent = `You said: "${transcript}"`;
  heard.classList.add('show');

  const said = transcript.toLowerCase();
  const rootMatch = said.includes(w.word.toLowerCase()) || said.includes(w.word.toLowerCase().slice(0, -1));

  if (rootMatch && said.trim().split(' ').length > 2) {
    verdict.textContent = "Nice work — that's a solid sentence!";
    verdict.className = 'verdict show good';
    score++;
    speak("Nice work! That's a solid sentence.");
  } else if (rootMatch) {
    verdict.textContent = "Good start — try building a full sentence with it next time.";
    verdict.className = 'verdict show good';
    score++;
    speak("Good start. Try building a full sentence with it next time.");
  } else {
    verdict.textContent = `Close — make sure you actually use the word "${w.word}" in your sentence.`;
    verdict.className = 'verdict show retry';
    speak(`Almost — try to actually use the word ${w.word} in your sentence.`);
  }
  nextBtn.classList.add('show');
}

let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '🎙️ Listening…';
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Your turn';
  };
  recognition.onerror = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Your turn';
    typeFallback.classList.add('show');
    heard.textContent = "Couldn't catch that — you can type your sentence below instead.";
    heard.classList.add('show');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    evaluateAnswer(transcript);
  };

  micBtn.addEventListener('click', () => {
    if (recognizing) { recognition.stop(); return; }
    try { recognition.start(); } catch (e) {}
  });
} else {
  footerNote.textContent = "Voice input isn't supported in this browser — type your sentence instead.";
  micBtn.textContent = '⌨️ Type instead';
  micBtn.addEventListener('click', () => typeFallback.classList.add('show'));
}

typeSubmit.addEventListener('click', () => {
  if (typeInput.value.trim()) {
    evaluateAnswer(typeInput.value.trim());
    typeInput.value = '';
    typeFallback.classList.remove('show');
  }
});
typeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') typeSubmit.click();
});

nextBtn.addEventListener('click', () => {
  idx++;
  if (idx >= words.length) {
    showDone();
  } else {
    loadWord();
  }
});

function showDone() {
  buildDots();
  mainCard.innerHTML = `
    <div class="done-screen">
      <p class="card-eyebrow">All done</p>
      <p class="word">Nice practice!</p>
      <p class="score">${score}/${words.length}</p>
      <p class="stage" style="text-align:center;">words you used out loud today.</p>
      <button class="btn-primary" id="restartBtn" style="width:100%;">Practise again</button>
    </div>`;
  speak(`You're done. You practised ${score} out of ${words.length} words. Nice work.`);
  document.getElementById('restartBtn').addEventListener('click', () => location.reload());
}

loadWord();
</script>
</body>
</html>
